# Pages CMS(https://app.pagescms.org) 웹 편집기 설정
media:
  input: public/media
  output: /media
  rename: random
  categories: [image]

content:
  - name: posts
    label: 공략 글
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      primary: title
      fields: [title, category, updated, draft]
      sort: [updated, title]
      default:
        sort: updated
        order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: slug
        label: 주소 (영문 소문자, 숫자, -)
        description: "글 주소 끝부분이 됩니다. 예: level-route → /naesil/level-route/"
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: 영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요.
      - name: category
        label: 분류
        type: reference
        required: true
        options:
          collection: categories
          value: "{fields.slug}"
          label: "{fields.name}"
          search: name
      - name: summary
        label: 한 줄 요약
        description: 분류 목록과 검색 결과에 보여요.
        type: text
      - name: patch
        label: 기준 패치
        description: "예: 2026년 9월 정기 점검"
        type: string
      - name: updated
        label: 수정일
        type: date
        required: true
      - name: tags
        label: 태그
        type: string
        list: true
      - name: order
        label: 목록 순서
        description: 숫자가 작을수록 분류 목록 위쪽에 보여요.
        type: number
        default: 100
      - name: draft
        label: 임시 저장 (체크하면 사이트에 안 보임)
        type: boolean
        default: false
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown

  - name: categories
    label: 분류
    type: collection
    path: src/content/categories
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      primary: name
      fields: [name, slug, order]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: 분류 이름
        type: string
        required: true
      - name: slug
        label: 주소 (영문 소문자, 숫자, -)
        description: "예: boss → /boss/. 글이 있는 분류의 주소를 바꾸면 그 글들의 분류도 다시 골라야 해요."
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: 영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요.
      - name: order
        label: 메뉴 순서
        description: 숫자가 작을수록 앞에 보여요.
        type: number
        default: 100
      - name: description
        label: 설명
        type: text
